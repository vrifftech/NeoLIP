name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '39 7 * * 1'
  repository_dispatch:
    types: [neoshared-updated]
  workflow_dispatch:
    inputs:
      neoshared_ref:
        description: neoshared branch, tag, or commit SHA (blank uses NEOSHARED_REF or main)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEOSHARED_REF: ${{ github.event.client_payload.neoshared_ref || inputs.neoshared_ref || vars.NEOSHARED_REF || 'main' }}

jobs:
  linux:
    name: Linux (GCC + system wxWidgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out NeoLIP
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: ${{ env.NEOSHARED_REF }}
          path: neoshared
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            file \
            ninja-build \
            pkg-config \
            libwxgtk3.2-dev \
            zlib1g-dev \
            xvfb xauth

      - name: Configure and build
        working-directory: tool
        run: |
          bash ./scripts/build.sh \
            --build-dir build \
            --build-type Release \
            --wx ON \
            --require-wx ON \
            --minimal-release OFF \
            --generator Ninja \
            --neoshared-root ../neoshared \
            --no-vcpkg \
            --jobs 2 \
            --clean \
            -- -DNEOLIP_BUILD_TESTS=ON

      - name: Test engine and native product UI
        run: ctest --test-dir tool/build -C Release --output-on-failure

      - name: Stage install tree
        run: cmake --install tool/build --config Release --prefix tool/stage

      - name: Verify Linux application package
        run: |
          test -x tool/stage/bin/NeoLIP
          test -d tool/stage/models
          test -d tool/stage/dictionaries
          file tool/stage/bin/NeoLIP
          cmake -DNEOLIP_PACKAGE_ROOT=tool/stage -P tool/scripts/validate-assets.cmake

      - name: Exercise GUI workflow with installed assets
        run: |
          export NEOLIP_TEST_APP_EXECUTABLE="$GITHUB_WORKSPACE/tool/stage/bin/NeoLIP"
          ctest --test-dir tool/build -C Release -R '^neolip_ui_tests$' --output-on-failure

      - name: Bundle the matching wxWidgets runtime
        run: bash tool/scripts/bundle-linux-wx.sh tool/stage

      - name: Verify bundled Linux runtime layout
        run: |
          test -x tool/stage/bin/NeoLIP
          test -x tool/stage/libexec/neolip/NeoLIP
          test -d tool/stage/lib/neolip

      - name: Package portable Linux application
        run: |
          mkdir -p tool/package/NeoLIP
          cp -a tool/stage/. tool/package/NeoLIP/
          tar -C tool/package -czf tool/NeoLIP-linux-x86_64.tar.gz NeoLIP

      - name: Upload Linux artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: NeoLIP-linux-portable-${{ github.sha }}
          path: tool/NeoLIP-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (Visual Studio 2026 + wxWidgets 3.3.3)
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

    steps:
      - name: Check out NeoLIP
        uses: actions/checkout@v7
        with:
          path: tool
          persist-credentials: false

      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          repository: vrifftech/neoshared
          ref: ${{ env.NEOSHARED_REF }}
          path: neoshared
          persist-credentials: false

      - name: Enable vcpkg GitHub Actions cache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install wxWidgets 3.3.3
        shell: pwsh
        run: |
          $sharedRoot = Join-Path $env:GITHUB_WORKSPACE 'neoshared'
          $installer = Join-Path $sharedRoot 'scripts\install-wxwidgets.ps1'
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "NeoShared wxWidgets installer was not found: $installer"
          }
          & $installer `
            -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT `
            -Triplet x64-windows-static `
            -CleanAfterBuild

      - name: Configure and build
        working-directory: tool
        shell: pwsh
        run: |
          .\scripts\build.ps1 `
            -BuildDir build `
            -BuildType Release `
            -Wx ON `
            -RequireWx ON `
            -MinimalRelease OFF `
            -Generator 'Visual Studio 18 2026' `
            -Platform x64 `
            -NeoSharedRoot ..\neoshared `
            -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT `
            -VcpkgTriplet x64-windows-static `
            -Parallel 2 `
            -Clean `
            -ExtraCMakeArgs '-DNEOLIP_BUILD_TESTS=ON'

      - name: Test engine and native product UI
        run: ctest --test-dir tool/build -C Release --output-on-failure

      - name: Stage install tree
        shell: pwsh
        run: cmake --install tool/build --config Release --prefix tool/stage

      - name: Verify Windows application package
        shell: pwsh
        run: |
          $required = @(
            'tool\stage\NeoLIP.exe',
            'tool\stage\models',
            'tool\stage\dictionaries'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "NeoLIP package is missing required output: $path"
            }
          }
          cmake -DNEOLIP_PACKAGE_ROOT=tool/stage -P tool/scripts/validate-assets.cmake
          if ($LASTEXITCODE -ne 0) {
            throw "NeoLIP's packaged asset check failed with exit code $LASTEXITCODE"
          }
          Get-ChildItem -LiteralPath 'tool\stage' | Format-Table Name, Length

      - name: Exercise GUI workflow with installed assets
        shell: pwsh
        run: |
          $env:NEOLIP_TEST_APP_EXECUTABLE = (Resolve-Path 'tool/stage/NeoLIP.exe').Path
          ctest --test-dir tool/build -C Release -R '^neolip_ui_tests$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Packaged-asset GUI tests failed' }

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'tool\package\NeoLIP' | Out-Null
          Copy-Item -Recurse -Force 'tool\stage\*' 'tool\package\NeoLIP\'
          Compress-Archive -Path 'tool\package\NeoLIP' -DestinationPath 'tool\NeoLIP-windows-x64.zip' -Force

      - name: Upload Windows artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: NeoLIP-windows-vs2026-${{ github.sha }}
          path: tool/NeoLIP-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
